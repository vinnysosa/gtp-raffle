<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>GTP Tailgate Raffle Admin</title>
  <link rel="icon" type="image/png" href="/gtp-logo.png">
  <style>
    html, body { margin:0; height:100%; background:#0b0a0f; }
    #app { display:block; border:0; width:100%; height:100%; height:100dvh; }
  </style>
</head>
<body>
  <iframe id="app" title="GTP Tailgate Raffle Admin"
    allow="clipboard-read; clipboard-write"></iframe>
  <script>
    // Apps Script only draws the "created by a Google Apps Script user" banner when /exec is
    // the top document, so operator pages are always loaded through this frame instead.
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwzhSiuuQmQEFOXdd960t3LFL2wfVmAYwnXeYmQQWfeHRUodcmDSrXhov7GMswQPmtd/exec';
    // Views are a fixed list. Framing a caller-supplied page would let a phishing link render
    // any page under this domain.
    var VIEWS = { reconcile: '?page=manage', kiosk: '?n=00' };
    var view = (new URLSearchParams(window.location.search).get('view') || '').trim();
    document.getElementById('app').src = EXEC_URL +
      (Object.prototype.hasOwnProperty.call(VIEWS, view) ? VIEWS[view] : '?page=admin');
  </script>
</body>
</html>
